spring.application.name=NewHires

# --- Conexión MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3306/rrhh
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=maria123MARIA

# --- Mailtrap (SMTP Sandbox) ---
spring.mail.host=authsmtp.securemail.pro
spring.mail.port=587
spring.mail.username=admin@manuelavilacazorla.store
spring.mail.password=a1234bA1234B
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.debug=true

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Naming Strategy ---
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Almacenamiento de Archivos ---
storage.location=${STORAGE_PATH:uploads}

app.cors.allowed-origins=http://localhost:4200
app.frontend.url=http://localhost:4200

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=-1

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE