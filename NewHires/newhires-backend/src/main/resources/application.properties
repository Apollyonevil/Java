spring.application.name=NewHires

# Conexión
spring.datasource.url=jdbc:mariadb://localhost:3306/rrhh
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=maria123MARIA

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Estrategia de nombrado (asegúrate que la clase termina en NamingStrategyStandardImpl)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

storage.location=./NewHires/newhires-backend/uploads

