spring.application.name=NewHires

# --- Conexión MariaDB ---
spring.datasource.url=jdbc:mariadb://localhost:3306/rrhh
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=maria123MARIA

# --- Mailtrap (SMTP Sandbox) ---
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=manuel.avila@civica-soft.com
spring.mail.password=a1234bA1234B!!!
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- JPA / Hibernate ---
# 'update' creará automáticamente las columnas candidateName y email en tu tabla 'submissions'
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Esto ayuda a ver exactamente qué datos se están guardando en los logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# --- Naming Strategy ---
# Mantenemos tu elección, pero asegúrate de que en MariaDB los nombres de columna coincidan con Java
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# --- Almacenamiento de Archivos ---
# Asegúrate de que esta carpeta exista o que el servicio tenga permisos para crearla
storage.location=./uploads