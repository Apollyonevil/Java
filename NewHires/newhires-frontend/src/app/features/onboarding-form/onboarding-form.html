<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      
      <div class="card shadow-lg border-0">
        <div class="card-header bg-dark text-white p-4">
          <h2 class="h4 mb-1">Formulario de Incorporación</h2>
          <p class="mb-0 opacity-75">Por favor, completa los datos y adjunta la documentación solicitada.</p>
        </div>

        <div class="card-body p-4">
          <form [formGroup]="dynamicForm" (ngSubmit)="onSubmit()">
            
            <div *ngFor="let field of fields" class="mb-4 pb-3 border-bottom">
              
              <label class="form-label fw-bold d-block mb-2">
                {{ field.label }}
                <span *ngIf="field.isRequired" class="text-danger" title="Obligatorio">*</span>
              </label>

              <ng-container [ngSwitch]="field.type">
                
                <input *ngSwitchCase="'text'" 
                       type="text" 
                       [formControlName]="field.id.toString()" 
                       class="form-control"
                       [placeholder]="field.placeholder || ''"
                       [class.is-invalid]="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">

                <input *ngSwitchCase="'number'" 
                       type="number" 
                       [formControlName]="field.id.toString()" 
                       class="form-control"
                       [placeholder]="field.placeholder || ''"
                       [class.is-invalid]="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">

                <select *ngSwitchCase="'select'" 
                        [formControlName]="field.id.toString()" 
                        class="form-select"
                        [class.is-invalid]="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">
                  <option value="">Selecciona una opción...</option>
                  <option *ngFor="let opt of field.options" [value]="opt">{{ opt }}</option>
                </select>

                <div *ngSwitchCase="'pdf'">
                <p *ngIf="field.placeholder" class="small mb-1 text-secondary">
                  <i class="bi bi-info-circle me-1"></i>{{ field.placeholder }}
                </p>
                <input type="file" 
                      (change)="onFileChange($event, field.id.toString())" 
                      class="form-control"
                      accept="application/pdf"
                      [class.is-invalid]="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">
                <div class="form-text"><small class="text-muted italic">Formato requerido: <strong>PDF</strong>.</small></div>
              </div>

              <div *ngSwitchCase="'jpg'">
                <p *ngIf="field.placeholder" class="small mb-1 text-secondary">
                  <i class="bi bi-camera me-1"></i>{{ field.placeholder }}
                </p>
                <input type="file" 
                      (change)="onFileChange($event, field.id.toString())" 
                      class="form-control"
                      accept="image/jpeg, image/jpg"
                      [class.is-invalid]="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">
                <div class="form-text"><small class="text-muted italic">Formato requerido: <strong>JPG/JPEG</strong>.</small></div>
              </div>

              </ng-container>

              <div class="invalid-feedback d-block" *ngIf="dynamicForm.get(field.id.toString())?.invalid && dynamicForm.get(field.id.toString())?.touched">
                <small>Este dato es obligatorio para procesar tu alta.</small>
              </div>
            </div>

            <div class="d-grid gap-2 mt-5">
              <button type="submit" 
                      [disabled]="dynamicForm.invalid" 
                      class="btn btn-success btn-lg shadow-sm">
                Enviar documentación
              </button>
            </div>

          </form>
        </div>
      </div>
      
    </div>
  </div>
</div>
